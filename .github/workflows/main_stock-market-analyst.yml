# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - usman-stock-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Environment variables for the job
env:
  AZURE_WEBAPP_NAME: usman-stock-app
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create deployment artifact
        run: |
          echo "Creating deployment package..."
          # Remove unnecessary files to reduce package size
          rm -rf .git .github .vscode __pycache__ *.pyc .venv venv .env .gitignore README.md
          echo "Package contents:"
          ls -la

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_84DAC9FD42AD4EA3B578A7C418F03300 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C11B9BA1B06C49849EDA99A60BC4AD87 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3275839903F545C2A6F91CFC211FD3B6 }}

      - name: Check Azure login status
        run: |
          az account show
          az webapp list --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}']"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: .

      - name: Restart App Service
        run: |
          az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group stock-analyst-rg

      - name: Get deployment URL
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Your app is available at: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
